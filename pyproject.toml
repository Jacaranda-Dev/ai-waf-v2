[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "ai_waf_v2"
version = "0.1.0"
description = "Transformer-based WAF Classifier"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # config & utils
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",           # pretty logging / progress bars
 
    # data
    "pandas>=2.0",
    "pyarrow>=14.0",        # parquet I/O
    "datasets>=2.14",       # HuggingFace datasets (for loading public datasets)
    "datasketch>=1.6",      # MinHash LSH deduplication
    "scikit-learn>=1.3",
 
    # tokenizer
    "sentencepiece>=0.1.99",
    "tokenizers>=0.15",     # HuggingFace fast tokenizers
 
    # model & training
    "torch>=2.2",
    "transformers>=4.38",
    "accelerate>=0.27",
 
    # quantization & export
    "bitsandbytes>=0.43",
    "onnx>=1.16",
    "onnxruntime-gpu>=1.17",
    "optimum>=1.17",        # HuggingFace optimum (ONNX export helpers)
 
    # experiment tracking
    "mlflow>=2.11",
 
    # evaluation
    "torchmetrics>=1.3",
    "shap>=0.44",
 
    # augmentation — LLM APIs
    "anthropic>=0.25",
    "google-generativeai>=0.5",
 
    # HTTP parsing
    "httptools>=0.6",

    
    "kagglehub>=0.2.0",
    "hydra-core",
    "tensorrt"
]

[project.optional-dependencies]
# For students writing docs, running notebooks, and reading code logic
research = [
    "jupyterlab",
    "ipykernel",
    "matplotlib",
    "seaborn",
    "pandas",
    "pyyaml",
    "ruff",
    "mypy",
    "pytest>=8.0",
    "pytest-cov>=5.0",
     "notebook",
]
# For students training models and running the full pipeline
full = [
    "torch",
    "transformers",
    "mlflow",
    "onnxruntime",
    "scikit-learn",
    "onnx"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stages*", "utils*", "ai_waf_v2*"]


[tool.ruff]
line-length = 100
target-version = "py310"
 
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]  # Error, Fact, Import sorting
ignore = ["E501"]
 
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
 
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"