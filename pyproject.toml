[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "ai-waf-v2"
version = "0.1.0"
description = "Transformer-based WAF Classifier"
dependencies = [
    "torch>=2.4.0",
    "transformers",
    "accelerate",
    "pyarrow",
    "pandas",
    "hydra-core",
    "onnx",
    "tensorrt"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy"
]
notebook = [
    "jupyterlab",
    "ipywidgets",
    "matplotlib",
    "seaborn"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stages*", "utils*", "ai-waf-v2*"]