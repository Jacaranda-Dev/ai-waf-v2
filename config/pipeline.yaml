# ai_waf_v2. pipeline Configuration
# All hyperparameters, paths, and SLOs live here.
# No magic numbers in stage scripts — import via ai_waf_v2.utils.config.

project:
  name: "ai-waf-v2"
  version: "0.1.0"
  seed: 42

paths:
  data_raw:            "data/raw"
  data_normalized:     "data/normalized"
  data_augmented:      "data/augmented"
  data_filtered:       "data/filtered"
  data_splits:         "data/splits"
  data_splits_pre_aug: "data/splits_pre_aug"
  models:              "models"
  tokenizers:          "tokenizers"
  reports:             "reports"
  mlruns:              "mlruns"

# ─── SLOs ────────────────────────────────────────────
slo:
  latency_inline_p99_ms: 5.0       # inline WAF: p99 < 5ms at batch=1
  latency_offline_p99_ms: 50.0     # log analysis: p99 < 50ms at batch=64
  throughput_min_rps: 10000        # requests/sec at batch=64
  max_false_positive_rate: 0.001   # 1 FP per 1000 legitimate requests

# ─── DATA ────────────────────────────────────────────
data:
  datasets:
    - name: "CSIC 2010"
      kaggle_handle: "ispangler/csic-2010-web-application-attacks"
      converter_id: "csic_v1"  
      description: "CSIC 2010 Web Application Attacks"
      url:  "https://www.kaggle.com/datasets/ispangler/csic-2010-web-application-attacks"
      mirrors: 
        - "https://gitlab.fing.edu.uy/gsi/web-application-attacks-datasets/-/blob/master/csic_2010/dataset_cisc_train_test.tar.gz"
      archive_sha256: ""
      manual_instructions: "Visit: https://www.kaggle.com/datasets/ispangler/csic-2010-web-application-attacks and place csv in data/raw/csic_2010.csv"
      license: "Data files © Original Authors"
      citation: |
        "?""
      output_filename: "csic_2010.csv"
      label_col: "classification"
    - name: "SR-BH 2020"
      kaggle_handle: "realhugnne/srbh2020-v2"
      converter_id: "sr_bh_v1"  
      description: "SR-BH 2020 multi-label dataset"
      url:  "https://investigacion.unir.net/documentos/668fc479b9e7c03b01bde810"
      mirrors:
        - "https://www.kaggle.com/api/v1/datasets/download/ispangler/csic-2010-web-application-attacks/csic-2010-web-application-attacks.zip"
      archive_sha256: "" 
      manual_instructions: "Download sr_bh_2020.csv from https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/OGOIXX# and place in data/raw/downloads/"
      license: " CC0 1.0"
      citation: |
        "Sureda Riera, Tomás, Juan Ramón Bermejo Higuera, Javier Bermejo Higuera, Juan Antonio Sicilia Montalvo, y José Javier Martínez Herráiz. «SR-BH 2020 multi-label dataset», 2022. https://doi.org/10.7910/DVN/OGOIXX.""
      output_filename: "sr_bh_2020.csv"
      label_col: "label"
    - name: "HTTPParams"
      kaggle_handle: "evg3n1j/httpparamsdataset"
      converter_id: "http_params_v1" 
      description: "Benign and malicious payloads in HTTP request parameters"
      url:  "https://www.kaggle.com/datasets/evg3n1j/httpparamsdataset"     
      mirrors:
        - "https://github.com/Morzeux/HttpParamsDataset/blob/master/payload_full.csv"
      archive_sha256: ""
      manual_instructions: "Download from GitHub and place in data/raw/downloads/httpparams_raw.csv"
      license: "MIT License"
      citation: |
        "?"
      output_filename: "httpparams_raw.csv"
      label_col: "label"

  schema:
    label_map:
      benign:    0
      malicious: 1
    attack_classes:
      - sqli
      - xss
      - lfi
      - rfi
      - ssrf
      - cmdi
      - xxe
      - ssti
      - path_traversal
      - header_injection

  split:
    train:       0.70
    val:         0.15
    test:        0.10
    adversarial: 0.03
    canary:      0.02
    stratify_by: ["label", "attack_class"]

  dedup:
    minhash_threshold:    0.85
    semantic_threshold:   0.90
    exact_hash:           true

# ─── AUGMENTATION ────────────────────────────────────
augmentation:
  min_samples_per_class: 500   # classes below this are flagged for augmentation
  target_per_class: 5000       # governor fills gaps up to this count
  chain_length: 2              # mutation chain depth in attack synthesis
  rules:
    mutations_per_sample: 20
    encodings:
      - url_encode
      - double_url_encode
      - hex_encode
      - unicode_escape
      - html_entity
      - comment_insertion
      - case_variation
      - whitespace_bypass

  grammar:
    targets: ["sqli", "xss", "lfi", "rfi", "ssrf", "cmdi"]
    samples_per_class: 5000

  llm_ratio: 0.5                         # fraction of seed payloads from LLM (0.0 = grammar only, 1.0 = LLM only)
  benign_llm_ratio: 0.33                 # fraction of total benign records from LLM (0.0 = programmatic only, 1.0 = LLM only)
  pcfg_grammars_path: "config/pcfg_grammars.yaml"  # recursive PCFG grammars; classes absent here use flat templates

  llm:
    provider:        "${LLM_PROVIDER}"   # anthropic | google | local | ollama
    model:           "mistral"                  # model name/tag for cloud and ollama providers
    model_path:      "${LOCAL_LLM_PATH}" # GGUF path; required for provider=local
    ollama_base_url:  "http://localhost:11434"
    request_timeout:  30                 # socket timeout in seconds (ollama only)
    temperature:      0.9
    max_tokens:       512                # Stage 3.1 attack payloads (short strings)
    max_tokens_benign: 768               # Stage 3.3 benign records (3 objects × ~200 tokens)
    batch_size_benign: 3                 # objects per LLM call in Stage 3.3 (keep small for local models)
    samples_per_gap_class: 1000          # Module A: payloads per gap class
    samples_benign:  10000               # Module B: standard benign records
    samples_edge_case: 2000              # Module B: edge-case benign records

  benign:
    rest_samples:   20000
    replay_enabled: false            # set true if CAIDA traces available
    replay_path:    "${CAIDA_PATH}"

  filtering:
    max_unk_ratio:          0.15
    min_token_length:       4
    max_token_length:       256
    label_consistency_check: true   # cross-check with ModSecurity CRS
    class_validity_check:    true   # reject payloads that don't match their attack_class structure

# ─── TOKENIZER ───────────────────────────────────────
tokenizer:
  seq_len: 256

  track_a:                          # pretrained vocab augmentation
    base_model:  "bert-base-uncased"
    output_dir:  "tokenizers/track_a"
    http_tokens:                    # injected as atomic units
      - "UNION"
      - "SELECT"
      - "INSERT"
      - "DROP"
      - "script"
      - "onerror"
      - "onload"
      - "../"
      - "%00"
      - "SLEEP"
      - "BENCHMARK"
      - "exec"
      - "eval"
      - "document.cookie"

  track_b:                          # custom BPE from scratch
    vocab_size:       8000
    character_coverage: 0.9999
    model_type:       "bpe"         # bpe | unigram | char | word
    output_dir:       "tokenizers/track_b"
    pad_token:        "[PAD]"
    unk_token:        "[UNK]"
    cls_token:        "[CLS]"
    sep_token:        "[SEP]"
    mask_token:       "[MASK]"

# ─── MODEL ───────────────────────────────────────────
model:
  track_a_large:
    base_model:     "microsoft/deberta-v3-base"
    num_labels:     2
    dropout:        0.1
    output_dir:     "models/track_a/large"

  track_a_small:
    base_model:     "google/bert_uncased_L-2_H-128_A-2"
    num_labels:     2
    dropout:        0.1
    output_dir:     "models/track_a/small"

  track_b_99m:                      # encoder from scratch
    d_model:        768
    n_layers:       13
    n_heads:        12
    d_ff:           3072            # 4 × d_model
    dropout:        0.1
    attn_dropout:   0.1
    max_seq_len:    256
    vocab_size:     8000            # must match tokenizer.track_b.vocab_size
    num_labels:     2
    pad_token_id:   0
    output_dir:     "models/track_b/99m"

  student:
    d_model:        256
    n_layers:       6
    n_heads:        4
    d_ff:           1024
    dropout:        0.1
    attn_dropout:   0.1
    max_seq_len:    256
    vocab_size:     8000
    num_labels:     2
    pad_token_id:   0
    output_dir:     "models/student"
    quantization:   "int8"          # int8 | int4 | none

# ─── TRAINING ────────────────────────────────────────
training:
  track_a:                          # DeBERTa / BERT fine-tuning (Track A)
    batch_size:             8
    grad_accum_steps:       8       # effective batch = 64
    max_steps:              20000
    warmup_ratio:           0.06
    peak_lr:                2.0e-5  # safe for pretrained backbone; backbone gets 2e-6 via 0.1× multiplier
    weight_decay:           0.01
    grad_clip_norm:         1.0
    label_smoothing:        0.1
    precision:              "bf16"
    early_stopping_patience: 5
    early_stopping_metric:  "auc_pr"
    operating_fpr_target:   0.001

  teacher:                          # Track B 99M training (from scratch)
    batch_size:             8
    grad_accum_steps:       4       # effective batch = 32
    max_steps:              50000
    warmup_ratio:           0.06
    peak_lr:                1.0e-4
    min_lr_ratio:           0.1     # min_lr = peak_lr × ratio
    weight_decay:           0.01
    adam_beta1:             0.9
    adam_beta2:             0.999
    adam_eps:               1.0e-8
    grad_clip_norm:         1.0
    label_smoothing:        0.1
    precision:              "bf16"
    eval_every_steps:       500
    save_every_steps:       1000
    early_stopping_patience: 10    # in eval intervals
    early_stopping_metric:  "auc_pr"
    operating_fpr_target:   0.001

  distillation:
    batch_size:             128
    grad_accum_steps:       8
    max_steps:              40000
    warmup_ratio:           0.06
    peak_lr:                2.0e-4
    weight_decay:           0.01
    grad_clip_norm:         1.0
    precision:              "bf16"
    alpha_soft:             0.7     # weight on KL(student || teacher)
    alpha_hard:             0.3     # weight on CrossEntropy(y_hat, y)
    temperature:            4.0
    hidden_mse_weight:      0.0     # disabled: tokenizers differ between models

# ─── EVALUATION ──────────────────────────────────────
evaluation:
  batch_sizes:      [1, 8, 32, 64, 256]
  devices:          ["gpu"]
  n_latency_warmup: 50
  n_latency_runs:   500
  metrics:
    - f1
    - precision
    - recall
    - fpr
    - fnr
    - auc_roc
    - auc_pr

  adversarial:
    tamper_scripts:
      - space2comment
      - between_comments
      - charunicodeescape
      - randomcase
      - base64encode
      - percentage
    evasion_wordlists:
      - "data/raw/evasion/waf_bypass.txt"

  ablation:
    tokenizer:        true
    augmentation:     true
    model_size:       true
    label_smoothing:  true

# ─── MLFLOW ──────────────────────────────────────────
mlflow:
  tracking_uri: "sqlite:///mlruns/mlflow.db"
  experiment_name: "ai-waf-v2"
  tags:
    project: "ai-waf-v2"
    framework: "pytorch"

# ─── HUGGING FACE ─────────────────────────────────────
# Set HF_ORG and HF_TOKEN environment variables before running push_hub.
# Use `huggingface-cli login` as an alternative to HF_TOKEN.
huggingface:
  org:     "${HF_ORG}"   # your HF username or org slug
  private: true
  repos:
    tokenizer:         "waf-tokenizer-track-b"
    teacher:           "waf-teacher-99m"
    student:           "waf-student-10m"
    dataset_base:      "waf-dataset-base"
    dataset_aug:       "waf-dataset-augmented"
    dataset_synthesis: "waf-dataset-synthesis"
    dataset_framed:    "waf-dataset-framed"